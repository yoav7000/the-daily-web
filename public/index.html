<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f5f2">
    <meta name="description" content="The Daily Web – חדשות, פוליטיקה, כלכלה, טכנולוגיה, ספורט ועוד. כתבות מעודכנות כל היום.">
    <title>The Daily Web — חדשות מעודכנות כל היום</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/pages.css">
    <script src="/js/theme.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/ui.js"></script>
</head>
<body data-shell="public" data-page="home">
    <script src="/js/shell.js"></script>

    <main class="container home" id="main" tabindex="-1">
        <h1 class="sr-only">The Daily Web: חדשות מעודכנות כל היום</h1>
        <div class="today-strip">
            <span id="currentDateDisplay">&nbsp;</span>
            <span class="dot" aria-hidden="true"></span>
            <span class="weather-chip" id="weatherChip">מזג האוויר נטען...</span>
        </div>

        <!-- latest headlines, rotating -->
        <div class="ticker" id="ticker">
            <span class="ticker-label">עכשיו באתר</span>
            <a class="ticker-link" id="tickerLink" href="/">טוענים את הכותרות האחרונות...</a>
            <span class="ticker-count" id="tickerCount" aria-hidden="true"></span>
        </div>

        <!-- search, "seen / not seen" filter and sorting. Above the lead story, so it never moves when the story goes away. -->
        <div class="card toolbar filter-bar" id="filterBar" role="search">
            <label class="input-icon grow">
                <svg class="icon"><use href="#i-search"></use></svg>
                <input class="input" type="search" id="searchInput" placeholder="חיפוש כתבות לפי כותרת או תקציר..." aria-label="חיפוש כתבות" autocomplete="off" data-search-input>
            </label>
            <button type="button" class="btn btn-secondary show-sm" id="filterToggle" data-action="toggle-filters" aria-expanded="false" aria-controls="filterPanel">
                <svg class="icon"><use href="#i-sliders-horizontal"></use></svg> סינון ומיון <span class="count" id="filterCount" hidden></span>
            </button>
            <div class="toolbar-fields" id="filterPanel">
                <div class="segmented" role="radiogroup" aria-label="סינון לפי קריאה">
                    <label><input type="radio" name="statusFilter" id="filterAll" value="all" checked><span>הכל</span></label>
                    <label><input type="radio" name="statusFilter" id="filterUnread" value="unread"><span>לא נצפו</span></label>
                    <label><input type="radio" name="statusFilter" id="filterRead" value="read"><span>נצפו</span></label>
                </div>
                <select id="sortSelect" class="select select-sm" aria-label="מיון הכתבות">
                    <option value="newest">החדשות ביותר</option>
                    <option value="oldest">הישנות ביותר</option>
                    <option value="popular">הפופולריות ביותר</option>
                </select>
            </div>
        </div>

        <!-- the lead story and the next three -->
        <section class="hero" id="heroSection" aria-label="הכתבות המרכזיות">
            <a class="hero-lead is-loading" id="heroLead" href="/" aria-busy="true">
                <img id="heroImage" src="/images/default-article.svg" alt="" hidden>
                <div class="hero-lead-body">
                    <span class="tag" id="heroCategory" hidden></span>
                    <h2 class="display hero-title" id="heroTitle"></h2>
                    <p class="hero-summary clamp-3" id="heroSummary"></p>
                    <div class="byline" id="heroByline"></div>
                </div>
            </a>
            <div class="hero-side">
                <h2 class="hero-side-title">עוד בכותרות</h2>
                <div id="heroSide" class="hero-side-list" style="display: contents">
                    <div class="card mini"><span class="skeleton mini-media"></span><div><span class="skeleton" style="height: 14px; width: 40%"></span><span class="skeleton" style="height: 18px; margin-top: 8px"></span></div></div>
                    <div class="card mini"><span class="skeleton mini-media"></span><div><span class="skeleton" style="height: 14px; width: 40%"></span><span class="skeleton" style="height: 18px; margin-top: 8px"></span></div></div>
                    <div class="card mini"><span class="skeleton mini-media"></span><div><span class="skeleton" style="height: 14px; width: 40%"></span><span class="skeleton" style="height: 18px; margin-top: 8px"></span></div></div>
                </div>
            </div>
        </section>

        <div class="feed-layout">
            <section class="feed" aria-labelledby="feedHeading">
                <div class="feed-head">
                    <div>
                        <h2 id="feedHeading">הפיד הראשי</h2>
                        <p class="muted small" id="feedMeta" aria-live="polite">&nbsp;</p>
                    </div>
                    <button type="button" class="btn btn-ghost btn-sm" id="clearFiltersBtn" data-action="clear-filters" hidden>
                        <svg class="icon"><use href="#i-x"></use></svg> ניקוי סינון
                    </button>
                </div>

                <div class="card-grid" id="articlesGrid" aria-live="off"></div>

                <div class="feed-status" id="feedStatus"></div>
                <div id="feedSentinel" aria-hidden="true" style="height: 1px"></div>
            </section>

            <aside class="side-col" aria-label="מידע נוסף">
                <!-- weather (the server asks the weather service at most once every 15 minutes) -->
                <section class="card widget weather-widget" id="weatherWidget" aria-labelledby="weatherTitle">
                    <h2 id="weatherTitle">מזג האוויר</h2>
                    <div class="weather-row">
                        <div class="weather-temp" id="weatherTemp">--°</div>
                        <span id="weatherIconBox"><svg class="icon weather-icon"><use href="#i-cloud-sun"></use></svg></span>
                    </div>
                    <div class="weather-meta">
                        <strong id="weatherCity">&nbsp;</strong>
                        <span id="weatherCondition">&nbsp;</span>
                        <span id="weatherWind" style="display: block"></span>
                    </div>
                </section>

                <section class="card widget" aria-labelledby="topTitle">
                    <h2 id="topTitle">הנקראות ביותר</h2>
                    <ol class="trending" id="topArticlesList">
                        <li><span class="skeleton" style="height: 36px; width: 28px"></span><span class="skeleton" style="height: 36px"></span></li>
                        <li><span class="skeleton" style="height: 36px; width: 28px"></span><span class="skeleton" style="height: 36px"></span></li>
                        <li><span class="skeleton" style="height: 36px; width: 28px"></span><span class="skeleton" style="height: 36px"></span></li>
                    </ol>
                </section>
            </aside>
        </div>
    </main>

    <script>
        const PAGE_LIMIT = 20;          // articles per request: the next 20 load as the reader nears the bottom
        const VIEWED_KEY = 'the_daily_web_viewed';
        const HERO_SIDE_COUNT = 3;

        // Everything the feed currently shows, in one place
        const feed = {
            page: 1, totalPages: 1, totalCount: 0, loaded: 0,
            started: false, loading: false, failed: false, request: 0,
            category: '', search: '', sort: 'newest', viewed: 'all'
        };

        const grid = document.getElementById('articlesGrid');
        const statusBox = document.getElementById('feedStatus');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');

        // The ids of the articles this browser has opened (written by the article page)
        function getViewedArticles() {
            try {
                return JSON.parse(localStorage.getItem(VIEWED_KEY) || '[]').slice(-300);
            } catch (e) {
                return [];
            }
        }

        const hasFilters = () => Boolean(feed.category || feed.search || feed.viewed !== 'all' || feed.sort !== 'newest');
        const authorOf = (article) => (article.author && article.author.fullName) || 'כתב המערכת';

        // ------------------------------------------------------------------------------------
        // Drawing
        // ------------------------------------------------------------------------------------

        function storyCard(article, viewedIds) {
            const seen = viewedIds.includes(article._id);
            return `
                <article class="card card-hover story">
                    <div class="story-media"><img src="${escapeHtml(article.mainImage || FALLBACK_IMAGE)}" alt="" loading="lazy" width="640" height="400"></div>
                    <div class="story-body">
                        <div class="story-meta">
                            <span class="tag">${escapeHtml(article.category)}</span>
                            <span class="viewed ${seen ? '' : 'is-new'}">${seen ? icon('check') + ' נצפתה' : 'חדש'}</span>
                        </div>
                        <h3 class="story-title"><a class="stretched" href="/article/${escapeHtml(article._id)}">${escapeHtml(article.title)}</a></h3>
                        <p class="story-summary clamp-2">${escapeHtml(article.summary || '')}</p>
                        <div class="story-foot">${escapeHtml(authorOf(article))} · ${escapeHtml(formatDate(article.publishedAt))}</div>
                    </div>
                </article>`;
        }

        function miniCard(article) {
            return `
                <article class="card card-hover mini">
                    <div class="mini-media"><img src="${escapeHtml(article.mainImage || FALLBACK_IMAGE)}" alt="" loading="lazy"></div>
                    <div>
                        <span class="tag">${escapeHtml(article.category)}</span>
                        <h3 class="mini-title clamp-3"><a class="stretched" href="/article/${escapeHtml(article._id)}">${escapeHtml(article.title)}</a></h3>
                        <span class="muted xsmall">${escapeHtml(formatDate(article.publishedAt))}</span>
                    </div>
                </article>`;
        }

        function skeletonCards(count) {
            return Array.from({ length: count }, () => `
                <div class="card story is-skeleton" aria-hidden="true">
                    <div class="story-media skeleton"></div>
                    <div class="story-body"><span class="skeleton" style="height: 12px; width: 30%"></span><span class="skeleton" style="height: 22px"></span><span class="skeleton" style="height: 14px; width: 80%"></span></div>
                </div>`).join('');
        }

        function showHero(articles) {
            const hero = document.getElementById('heroSection');
            if (articles.length === 0) {
                hero.hidden = true;
                return;
            }
            const [lead, ...others] = articles;
            hero.hidden = false;
            const link = document.getElementById('heroLead');
            link.classList.remove('is-loading');
            link.removeAttribute('aria-busy');
            link.href = `/article/${lead._id}`;
            const image = document.getElementById('heroImage');
            image.hidden = false;
            image.dataset.fallbackApplied = '';
            image.src = lead.mainImage || FALLBACK_IMAGE;
            const category = document.getElementById('heroCategory');
            category.textContent = lead.category;
            category.hidden = false;
            document.getElementById('heroTitle').textContent = lead.title;
            document.getElementById('heroSummary').textContent = lead.summary || '';
            document.getElementById('heroByline').innerHTML =
                `<span>${escapeHtml(authorOf(lead))}</span><span class="sep"></span><span>${escapeHtml(formatDate(lead.publishedAt))}</span>`;
            document.getElementById('heroSide').innerHTML = others.slice(0, HERO_SIDE_COUNT).map(miniCard).join('');
        }

        function resetHeroToLoading() {
            const link = document.getElementById('heroLead');
            link.classList.add('is-loading');
            link.setAttribute('aria-busy', 'true');
            document.getElementById('heroImage').hidden = true;
            document.getElementById('heroCategory').hidden = true;
            document.getElementById('heroTitle').textContent = '';
            document.getElementById('heroSummary').textContent = '';
            document.getElementById('heroByline').textContent = '';
        }

        function updateMeta() {
            const heading = feed.search ? 'תוצאות חיפוש' : (feed.category ? `מדור ${feed.category}` : 'הפיד הראשי');
            document.getElementById('feedHeading').textContent = heading;
            const meta = document.getElementById('feedMeta');
            if (feed.loading && feed.loaded === 0) meta.textContent = 'טוענים כתבות...';
            else if (feed.failed && feed.loaded === 0) meta.textContent = '';
            else meta.textContent = feed.totalCount === 0 ? 'לא נמצאו כתבות' : `מוצגות ${feed.loaded} מתוך ${feed.totalCount} כתבות`;
            document.getElementById('clearFiltersBtn').hidden = !hasFilters();

            // small screens keep sorting and "seen / not seen" behind a button: show how many of them are active
            const active = (feed.viewed !== 'all' ? 1 : 0) + (feed.sort !== 'newest' ? 1 : 0);
            const count = document.getElementById('filterCount');
            count.textContent = active;
            count.hidden = active === 0;
        }

        UI.on('toggle-filters', (button) => {
            const open = document.getElementById('filterBar').classList.toggle('is-open');
            button.setAttribute('aria-expanded', String(open));
        });

        function updateStatus() {
            if (feed.loading) {
                statusBox.innerHTML = feed.loaded > 0 ? '<span class="spinner"></span><span>טוענים עוד כתבות...</span>' : '';
            } else if (feed.failed) {
                statusBox.innerHTML = UI.stateHtml({ icon: 'triangle-alert', title: 'לא הצלחנו לטעון כתבות', text: 'בדקו את החיבור ונסו שוב.', action: { name: 'retry-feed', label: 'ניסיון חוזר' } });
            } else if (feed.loaded === 0) {
                statusBox.innerHTML = UI.stateHtml({
                    icon: 'search',
                    title: 'לא נמצאו כתבות',
                    text: 'נסו מילות חיפוש אחרות, או הסירו חלק מהמסננים.',
                    action: hasFilters() ? { name: 'clear-filters', label: 'ניקוי כל המסננים' } : null
                });
            } else if (feed.page > feed.totalPages) {
                statusBox.innerHTML = '<div class="feed-end">הגעתם לסוף הפיד</div>';
            } else {
                statusBox.innerHTML = '<button type="button" class="btn btn-secondary" data-action="load-more">טעינת כתבות נוספות</button>';
            }
        }

        // ------------------------------------------------------------------------------------
        // Loading (search, filters, sorting and "more" all happen here, without reloading the page)
        // ------------------------------------------------------------------------------------

        function feedUrl() {
            const params = new URLSearchParams({ page: feed.page, limit: PAGE_LIMIT, sort: feed.sort });
            if (feed.category) params.set('category', feed.category);
            if (feed.search) params.set('search', feed.search);
            // "seen / not seen": the server filters the whole archive using the ids this browser remembers
            if (feed.viewed !== 'all') {
                params.set('viewed', feed.viewed);
                params.set('viewedIds', getViewedArticles().join(','));
            }
            return `/api/articles/public?${params}`;
        }

        async function loadFeed(reset) {
            if (!reset && (!feed.started || feed.loading || feed.page > feed.totalPages || feed.failed)) return;
            const thisRequest = ++feed.request; // a newer request makes this answer obsolete

            if (reset) {
                feed.started = true;
                feed.page = 1;
                feed.totalPages = 1;
                feed.totalCount = 0;
                feed.loaded = 0;
                grid.innerHTML = skeletonCards(6);
                if (!showsHero()) document.getElementById('heroSection').hidden = true;
                else resetHeroToLoading();
            }
            feed.loading = true;
            feed.failed = false;
            updateMeta();
            updateStatus();

            try {
                const data = await api('GET', feedUrl());
                if (thisRequest !== feed.request) return;

                feed.totalPages = data.pagination.totalPages;
                feed.totalCount = data.pagination.totalCount;
                let articles = data.articles;

                // the first page of the plain feed opens with the lead story; the cards below start after it
                if (reset) {
                    grid.innerHTML = '';
                    if (showsHero()) {
                        const heroCount = 1 + HERO_SIDE_COUNT;
                        showHero(articles.slice(0, heroCount));
                        articles = articles.slice(heroCount);
                    }
                }

                const viewedIds = getViewedArticles();
                grid.insertAdjacentHTML('beforeend', articles.map((article) => storyCard(article, viewedIds)).join(''));
                feed.loaded += data.articles.length;
                feed.page += 1;
            } catch (err) {
                if (thisRequest !== feed.request) return;
                feed.failed = true;
                if (reset) grid.innerHTML = '';
            } finally {
                if (thisRequest === feed.request) {
                    feed.loading = false;
                    updateMeta();
                    updateStatus();
                    keepFilling();
                }
            }
        }

        // The lead story belongs to the plain feed: it is not shown among search results or "seen" lists
        function showsHero() {
            return !feed.search && feed.viewed === 'all' && feed.sort === 'newest';
        }

        // ------------------------------------------------------------------------------------
        // Infinite scroll
        // ------------------------------------------------------------------------------------

        function nearBottom() {
            const sentinel = document.getElementById('feedSentinel');
            return sentinel.getBoundingClientRect().top < window.innerHeight + 600;
        }

        // If the loaded cards do not reach far enough below the screen yet, load the next batch
        function keepFilling() {
            requestAnimationFrame(() => {
                if (!feed.loading && !feed.failed && feed.page <= feed.totalPages && nearBottom()) loadFeed(false);
            });
        }

        if ('IntersectionObserver' in window) {
            new IntersectionObserver((entries) => {
                if (entries.some((entry) => entry.isIntersecting)) loadFeed(false);
            }, { rootMargin: '600px 0px' }).observe(document.getElementById('feedSentinel'));
        } else {
            window.addEventListener('scroll', keepFilling, { passive: true });
        }

        // ------------------------------------------------------------------------------------
        // Filters
        // ------------------------------------------------------------------------------------

        function syncUrl(push) {
            const params = new URLSearchParams();
            if (feed.category) params.set('category', feed.category);
            if (feed.search) params.set('q', feed.search);
            const url = window.location.pathname + (params.toString() ? `?${params}` : '');
            if (url !== window.location.pathname + window.location.search) {
                window.history[push ? 'pushState' : 'replaceState'](null, '', url);
            }
        }

        function setCategory(category, push) {
            feed.category = category;
            Shell.setActiveCategory(category);
            if (push !== false) syncUrl(true);
            loadFeed(true);
        }

        function readUrlIntoState() {
            const params = new URLSearchParams(window.location.search);
            const category = params.get('category') || '';
            const known = [...document.querySelectorAll('#siteNav .nav-pill')].map((pill) => pill.dataset.category);
            feed.category = known.includes(category) ? category : '';
            feed.search = (params.get('q') || '').trim();
            searchInput.value = feed.search;
            Shell.setActiveCategory(feed.category);
        }

        // Clicking a section in the header filters in place (opening it in a new tab still works normally)
        document.addEventListener('click', (event) => {
            const link = event.target.closest('#siteNav a[data-category]');
            if (!link || event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey) return;
            event.preventDefault();
            setCategory(link.dataset.category);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        window.addEventListener('popstate', () => {
            readUrlIntoState();
            loadFeed(true);
        });

        searchInput.addEventListener('input', debounce(() => {
            feed.search = searchInput.value.trim();
            syncUrl(false);
            loadFeed(true);
        }, 300));

        document.querySelectorAll('input[name="statusFilter"]').forEach((radio) => {
            radio.addEventListener('change', () => {
                feed.viewed = document.querySelector('input[name="statusFilter"]:checked').value;
                loadFeed(true);
            });
        });

        sortSelect.addEventListener('change', () => {
            feed.sort = sortSelect.value;
            loadFeed(true);
        });

        UI.on('clear-filters', () => {
            feed.category = '';
            feed.search = '';
            feed.viewed = 'all';
            feed.sort = 'newest';
            searchInput.value = '';
            sortSelect.value = 'newest';
            document.getElementById('filterAll').checked = true;
            Shell.setActiveCategory('');
            syncUrl(true);
            loadFeed(true);
        });

        UI.on('retry-feed', () => {
            feed.failed = false;
            loadFeed(feed.loaded === 0);
        });

        UI.on('load-more', () => loadFeed(false));

        // ------------------------------------------------------------------------------------
        // Side widgets, headlines ticker
        // ------------------------------------------------------------------------------------

        async function showWeather() {
            const weather = await loadWeather();
            const chip = document.getElementById('weatherChip');
            if (!weather) {
                chip.textContent = 'מזג האוויר אינו זמין כרגע';
                document.getElementById('weatherCondition').textContent = 'מזג האוויר אינו זמין כרגע';
                return;
            }
            chip.innerHTML = `${icon(weather.icon)} ${escapeHtml(weather.city)} · <span class="num">${escapeHtml(weather.temp)}°</span>`;
            document.getElementById('weatherTemp').textContent = `${weather.temp}°`;
            document.getElementById('weatherCity').textContent = weather.city;
            document.getElementById('weatherCondition').textContent = weather.condition;
            document.getElementById('weatherWind').textContent = `רוח: ${weather.windSpeed} קמ"ש`;
            document.getElementById('weatherIconBox').innerHTML = icon(weather.icon, 'weather-icon');
        }

        async function showTopArticles() {
            const list = document.getElementById('topArticlesList');
            try {
                const data = await api('GET', '/api/analytics/overview/top?limit=5');
                if (!data.topArticles || data.topArticles.length === 0) {
                    list.innerHTML = '<li style="display: block" class="muted small">עדיין אין נתוני צפייה.</li>';
                    return;
                }
                list.innerHTML = data.topArticles.map((article, index) => `
                    <li>
                        <span class="rank" aria-hidden="true">${index + 1}</span>
                        <div>
                            <span class="tag xsmall">${escapeHtml(article.category)}</span>
                            <div class="trend-title"><a class="stretched" href="/article/${escapeHtml(article._id)}">${escapeHtml(article.title)}</a></div>
                            <div class="trend-meta num">${icon('eye')} ${Number(article.totalViews).toLocaleString('he-IL')} צפיות</div>
                        </div>
                    </li>`).join('');
            } catch (err) {
                list.innerHTML = '<li style="display: block" class="muted small">לא הצלחנו לטעון את הדירוג.</li>';
            }
        }

        // The newest headlines, one at a time (it stands still for people who asked for less motion)
        async function startTicker() {
            try {
                const data = await api('GET', '/api/articles/public?limit=6&sort=newest');
                const items = data.articles || [];
                const ticker = document.getElementById('ticker');
                if (items.length < 2) {
                    ticker.hidden = true;
                    return;
                }
                const link = document.getElementById('tickerLink');
                const count = document.getElementById('tickerCount');
                let index = 0;
                let paused = false;

                const show = () => {
                    link.href = `/article/${items[index]._id}`;
                    link.textContent = items[index].title;
                    count.textContent = `${index + 1}/${items.length}`;
                };
                show();

                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                ticker.addEventListener('mouseenter', () => { paused = true; });
                ticker.addEventListener('mouseleave', () => { paused = false; });
                ticker.addEventListener('focusin', () => { paused = true; });
                ticker.addEventListener('focusout', () => { paused = false; });
                setInterval(() => {
                    if (paused || document.hidden) return;
                    link.classList.add('is-swapping');
                    setTimeout(() => {
                        index = (index + 1) % items.length;
                        show();
                        link.classList.remove('is-swapping');
                    }, 250);
                }, 6000);
            } catch (err) {
                document.getElementById('ticker').hidden = true; // the ticker is optional
            }
        }

        // ------------------------------------------------------------------------------------
        // Start
        // ------------------------------------------------------------------------------------

        document.addEventListener('DOMContentLoaded', () => {
            // Old links like /?articleId=... lead to the real article page
            const linkedArticleId = new URLSearchParams(window.location.search).get('articleId');
            if (linkedArticleId) {
                window.location.replace(`/article/${encodeURIComponent(linkedArticleId)}`);
                return;
            }

            document.getElementById('currentDateDisplay').textContent = formatToday();
            readUrlIntoState();
            loadFeed(true);
            showWeather();
            showTopArticles();
            startTicker();
        });
    </script>
</body>
</html>
