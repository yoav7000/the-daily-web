<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Daily Web — כניסת צוות מערכת (כתבים ועורכים)</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&family=Frank+Ruhl+Libre:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 RTL CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --font-editorial: 'Frank Ruhl Libre', serif;
            --font-sans: 'Assistant', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-num: 'Inter', monospace;
            
            --news-dark: #111827;
            --news-ink: #1f2937;
            --news-muted: #64748b;
            --news-border: #e2e8f0;
            --news-bg-subtle: #f8fafc;
            --news-red: #dc2626;
            --news-blue: #2563eb;
            --news-gold: #d97706;
            --news-green: #16a34a;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: var(--news-ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .font-editorial { font-family: var(--font-editorial); }
        .font-num { font-family: var(--font-num); }

        .auth-container {
            max-width: 480px;
            width: 100%;
            margin: auto;
            padding: 20px;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3), 0 8px 10px -6px rgb(0 0 0 / 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .auth-header {
            background: #ffffff;
            padding: 28px 24px 20px;
            text-align: center;
            border-bottom: 1px solid var(--news-border);
        }

        .auth-brand {
            font-family: var(--font-editorial);
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--news-dark);
            text-decoration: none;
            letter-spacing: -0.5px;
            display: inline-block;
        }

        .auth-subtitle {
            color: var(--news-muted);
            font-size: 0.92rem;
            margin-top: 4px;
        }

        .auth-body {
            padding: 28px 24px;
        }

        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            transform: scale(0.85) translateY(-0.75rem) translateX(0.15rem);
        }

        .form-control:focus {
            border-color: var(--news-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-submit {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            border: none;
            color: #ffffff;
            font-weight: 700;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.05rem;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #1e40af, #1d4ed8);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
            color: #ffffff;
        }

        .nav-tabs .nav-link {
            font-weight: 700;
            color: var(--news-muted);
            border: none;
            border-bottom: 2px solid transparent;
            padding: 10px 16px;
        }

        .nav-tabs .nav-link.active {
            color: var(--news-blue);
            border-bottom: 2px solid var(--news-blue);
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Top Back Link -->
        <div class="text-center mb-3">
            <a href="/" class="text-light text-decoration-none opacity-75 hover-opacity-100 d-inline-flex align-items-center gap-1">
                <i class="bi bi-arrow-right"></i> חזרה לעמוד הבית של The Daily Web
            </a>
        </div>

        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="auth-brand">The Daily Web</a>
                <div class="auth-subtitle">פורטל ניהול, כתיבה ועריכה למערכת העיתון</div>
            </div>

            <!-- Tab Navigation (Login vs Register) -->
            <ul class="nav nav-tabs nav-fill px-3 pt-2" id="authTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button" role="tab">
                        <i class="bi bi-box-arrow-in-right me-1"></i> התחברות
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button" role="tab">
                        <i class="bi bi-person-plus me-1"></i> הרשמת עובד חדש
                    </button>
                </li>
            </ul>

            <div class="auth-body">
                <!-- Alert Message Box -->
                <div id="authAlert" class="alert d-none" role="alert"></div>

                <div class="tab-content" id="authTabContent">
                    
                    <!-- 1. LOGIN PANEL -->
                    <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                        <form id="loginForm">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="loginUsername" placeholder="שם משתמש" required autocomplete="username">
                                <label for="loginUsername"><i class="bi bi-person me-1"></i> שם משתמש</label>
                            </div>

                            <div class="form-floating mb-3 position-relative">
                                <input type="password" class="form-control" id="loginPassword" placeholder="סיסמה" required autocomplete="current-password">
                                <label for="loginPassword"><i class="bi bi-lock me-1"></i> סיסמה</label>
                                <button type="button" class="btn btn-link position-absolute top-50 end-0 translate-middle-y text-muted text-decoration-none me-2" id="toggleLoginPassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                                    <label class="form-check-label text-muted small" for="rememberMe">
                                        זכור אותי במכשיר זה
                                    </label>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-submit w-100 d-flex align-items-center justify-content-center gap-2" id="loginSubmitBtn">
                                <span>התחבר למערכת</span>
                                <i class="bi bi-arrow-left"></i>
                            </button>
                        </form>

                        <!-- Quick Demo Fillers for Live Presentation -->
                        <div class="mt-4 pt-3 border-top">
                            <div class="text-muted small fw-semibold mb-2 text-center">התחברות מהירה למשתמשי הדגמה (Seeded):</div>
                            <div class="row g-2">
                                <div class="col-6">
                                    <button type="button" class="btn btn-outline-primary btn-sm w-100 py-2 fw-semibold" onclick="fillDemoLogin('dan_reporter', 'password123')">
                                        <i class="bi bi-pencil-square d-block fs-6 mb-1"></i> כתב: דן שטרן
                                    </button>
                                </div>
                                <div class="col-6">
                                    <button type="button" class="btn btn-outline-success btn-sm w-100 py-2 fw-semibold" onclick="fillDemoLogin('sarah_editor', 'password123')">
                                        <i class="bi bi-shield-check d-block fs-6 mb-1"></i> עורכת: שרה לוי
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 2. REGISTER PANEL -->
                    <div class="tab-pane fade" id="register-panel" role="tabpanel">
                        <form id="registerForm">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="regFullName" placeholder="שם מלא" required>
                                <label for="regFullName"><i class="bi bi-card-heading me-1"></i> שם מלא</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="regUsername" placeholder="שם משתמש" required autocomplete="username">
                                <label for="regUsername"><i class="bi bi-person me-1"></i> שם משתמש</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="regPassword" placeholder="סיסמה" required autocomplete="new-password">
                                <label for="regPassword"><i class="bi bi-lock me-1"></i> סיסמה (לפחות 6 תווים)</label>
                            </div>

                            <button type="submit" class="btn btn-submit w-100 d-flex align-items-center justify-content-center gap-2" id="regSubmitBtn">
                                <span>צור חשבון והתחבר</span>
                                <i class="bi bi-check-circle"></i>
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>

        <div class="text-center mt-3 text-light opacity-50 small font-num">
            The Daily Web System &copy; 2026
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>

    <script>
        // Check if user is already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const res = await fetch('/api/auth/me', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.user) {
                            redirectByRole(data.user.role);
                        }
                    }
                } catch (e) {
                    console.log('Session check skipped');
                }
            }
        });

        function showAlert(message, type = 'danger') {
            const alertEl = document.getElementById('authAlert');
            alertEl.className = `alert alert-${type} d-flex align-items-center gap-2`;
            alertEl.innerHTML = `<i class="bi ${type === 'danger' ? 'bi-exclamation-triangle-fill' : 'bi-check-circle-fill'}"></i> <div>${escapeHtml(message)}</div>`;
            alertEl.classList.remove('d-none');
        }

        function clearAlert() {
            const alertEl = document.getElementById('authAlert');
            alertEl.classList.add('d-none');
            alertEl.innerHTML = '';
        }

        function redirectByRole(role) {
            if (role === 'editor') {
                window.location.href = '/editor.html';
            } else {
                window.location.href = '/reporter.html';
            }
        }

        // Toggle Password Visibility
        const toggleLoginPassword = document.getElementById('toggleLoginPassword');
        const loginPasswordInput = document.getElementById('loginPassword');
        toggleLoginPassword.addEventListener('click', () => {
            const type = loginPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            loginPasswordInput.setAttribute('type', type);
            toggleLoginPassword.innerHTML = type === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
        });

        // Handle Login Submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearAlert();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const submitBtn = document.getElementById('loginSubmitBtn');

            if (!username || !password) {
                showAlert('נא להזין שם משתמש וסיסמה');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> מתחבר...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showAlert('התחברת בהצלחה! מעביר אותך לאזור העבודה...', 'success');
                    setTimeout(() => {
                        redirectByRole(data.user.role);
                    }, 500);
                } else {
                    showAlert(data.message || 'שם משתמש או סיסמה שגויים');
                }
            } catch (err) {
                showAlert('אירעה שגיאה בהתחברות. ודא שהשרת פעיל ונסה שוב.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>התחבר למערכת</span> <i class="bi bi-arrow-left"></i>';
            }
        });

        // Handle Register Submission
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearAlert();

            const fullName = document.getElementById('regFullName').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const submitBtn = document.getElementById('regSubmitBtn');

            if (!fullName || !username || !password) {
                showAlert('נא למלא את כל השדות');
                return;
            }

            if (password.length < 6) {
                showAlert('הסיסמה חייבת להכיל לפחות 6 תווים');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> יוצר חשבון...';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, username, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showAlert('החשבון נוצר בהצלחה! מעביר אותך...', 'success');
                    setTimeout(() => {
                        redirectByRole(data.user.role);
                    }, 600);
                } else {
                    showAlert(data.message || 'שגיאה ביצירת החשבון');
                }
            } catch (err) {
                showAlert('אירעה שגיאה ברישום. נסה שוב מאוחר יותר.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>צור חשבון והתחבר</span> <i class="bi bi-check-circle"></i>';
            }
        });

        // Fill credentials for demo users and trigger login
        function fillDemoLogin(username, password) {
            document.getElementById('loginUsername').value = username;
            document.getElementById('loginPassword').value = password;
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }
    </script>
</body>
</html>
