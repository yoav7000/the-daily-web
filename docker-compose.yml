services:
  app:
    build: .
    container_name: the-daily-web-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/the-daily-web
      - JWT_SECRET=${JWT_SECRET:-change-me-in-your-env-file}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-your-env-file}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./src:/usr/src/app/src
      - ./public:/usr/src/app/public

  mongodb:
    image: mongo:7
    container_name: the-daily-web-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: the-daily-web
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

volumes:
  mongo_data:
